services:
  attendance:
    build: .
    image: attendance:latest
    container_name: attendance
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Shanghai
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  app_net:
    external: true
